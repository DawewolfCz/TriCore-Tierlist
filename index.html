<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriCore Tierlist - Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-bg: #141721;
            --border-color: #252a3a;
            --text-main: #ffffff;
            --text-muted: #a0a6b5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .main-title {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 800;
            margin: 10px 0 20px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 4px 25px rgba(255, 0, 0, 0.35);
            background: linear-gradient(135deg, #c084fc 0%, #1f2430 45%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: #ff0055;
        }

        .nav-bar {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            justify-content: center;
        }

        .nav-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .nav-item img {
            width: 18px;
            height: 18px;
            filter: brightness(0.9);
        }

        .nav-item:hover {
            background-color: #1e2333;
            color: var(--text-main);
            border-color: #4b5563;
        }

        .nav-item:hover img {
            filter: brightness(1.2);
        }

        .nav-item.active {
            background-color: #1e2333;
            color: var(--text-main);
            border-color: #4b5563;
            border-bottom: 2px solid #ffaa00;
        }

        .nav-item.active img {
            filter: brightness(1.2);
        }

        .ranking-container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .table-header {
            display: flex;
            padding: 14px 20px;
            background-color: #10131a;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-row:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .rank-skin-box {
            display: flex;
            align-items: center;
            width: 155px;
            height: 52px;
            margin-right: 20px;
            position: relative;
            background-color: #272d3f;
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
            overflow: hidden;
        }

        .rank-skin-box.rank-1 { background: linear-gradient(135deg, #fde047, #ca8a04); color: #000; }
        .rank-skin-box.rank-2 { background: linear-gradient(135deg, #cbd5e1, #64748b); color: #000; }
        .rank-skin-box.rank-3 { background: linear-gradient(135deg, #fb923c, #c2410c); color: #fff; }
        .rank-skin-box.rank-4 { background: linear-gradient(135deg, #475569, #1e293b); color: #fff; }

        .rank-skin-box.rank-1::after,
        .rank-skin-box.rank-2::after,
        .rank-skin-box.rank-3::after,
        .rank-skin-box.rank-4::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.5) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shine 4s infinite ease-in-out;
        }

        @keyframes shine {
            0% { left: -100%; top: -100%; }
            20% { left: 150%; top: 150%; }
            100% { left: 150%; top: 150%; }
        }

        .player-rank-num {
            font-weight: 800;
            font-size: 1.2rem;
            font-style: italic;
            width: 50px;
            text-align: center;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .player-avatar-skin {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            margin-left: 10px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
            z-index: 2;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .player-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .player-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .player-region {
            width: 45px;
            font-weight: 700;
            font-size: 0.75rem;
            text-align: center;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .region-eu { background: rgba(74, 222, 128, 0.2); color: #4ade80; }

        .player-tiers {
            display: flex;
            gap: 15px;
            margin-left: auto;
            align-items: center;
        }

        .tier-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35px;
        }

        .tier-icon-img {
            width: 18px;
            height: 18px;
            margin-bottom: 4px;
            filter: brightness(1.1);
        }

        .tier-badge {
            font-size: 0.75rem;
            font-weight: 800;
        }

        .ht1 { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
        .lt1 { color: #fb923c; }
        .ht2 { color: #fbbf24; }
        .lt2 { color: #facc15; }
        .ht3 { color: #a3e635; }
        .ht4 { color: #38bdf8; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: #141721;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 380px;
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #1e2333;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #2d364d;
            color: #fff;
        }

        .modal-avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fde047;
            background: #1e2333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.3);
            overflow: hidden;
        }

        .modal-avatar-container img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .modal-username {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #c084fc 0%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-badge {
            background-color: #3b351c;
            border: 1px solid #786619;
            color: #fde047;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .modal-region {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .modal-namemc {
            background-color: #1a1f2c;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .modal-namemc:hover {
            background-color: #252a3a;
            color: #fff;
        }

        .modal-section-title {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .modal-position-box {
            width: 100%;
            background-color: #10131a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-pos-number {
            background: linear-gradient(135deg, #fde047, #ca8a04);
            color: #000;
            font-weight: 800;
            font-style: italic;
            font-size: 1rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 12px;
        }

        .modal-pos-text {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }

        .modal-tiers-box {
            width: 100%;
            background-color: #10131a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>

    <h1 class="main-title">TriCore Tierlist</h1>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search player...">
    </div>

    <!-- Navigační lišta upravena na tvých 8 custom kitů -->
    <div class="nav-bar" id="navBar">
        <div class="nav-item active" data-category="overall">Overall</div>
        <div class="nav-item" data-category="neth axe">Neth Axe</div>
        <div class="nav-item" data-category="explosive diarrhea">Explosive Diarrhea</div>
        <div class="nav-item" data-category="dia mace">Dia Mace</div>
        <div class="nav-item" data-category="boat mace">Boat Mace</div>
        <div class="nav-item" data-category="poorsmp">PoorSMP</div>
        <div class="nav-item" data-category="netherite berry">Netherite Berry</div>
        <div class="nav-item" data-category="drainpvp">DrainPVP</div>
        <div class="nav-item" data-category="lt mace">LT Mace</div>
    </div>

    <div class="ranking-container">
        <div class="table-header">
            <span style="width: 175px;">Player</span>
            <span style="width: 250px;"></span>
            <span style="width: 45px; text-align: center;">Region</span>
            <span style="margin-left: auto;">Tiers</span>
        </div>

        <div id="tableBody"></div>
    </div>

    <div class="modal-overlay" id="playerModal">
        <div class="modal-card">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-avatar-container">
                <img id="modalAvatar" src="" alt="Avatar">
            </div>
            <div class="modal-username" id="modalUsername">PlayerName</div>
            <div class="modal-badge">🏆 <span id="modalTitleText">Combat Member</span></div>
            <div class="modal-region" id="modalRegionText">Europe</div>
            
            <a href="#" target="_blank" class="modal-namemc" id="modalNameMCLink">
                🔗 NameMC
            </a>

            <div class="modal-section-title">Position</div>
            <div class="modal-position-box">
                <span class="modal-pos-number" id="modalPosNum">1.</span>
                <span class="modal-pos-text"><span id="modalCategoryName">OVERALL</span> (<span id="modalPoints">300 points</span>)</span>
            </div>

            <div class="modal-section-title">Tiers</div>
            <div class="modal-tiers-box" id="modalTiersBox"></div>
        </div>
    </div>

    <script>
        // Seznam tvých 8 kitů
        const allKits = [
            'neth axe',
            'explosive diarrhea',
            'dia mace',
            'boat mace',
            'poorsmp',
            'netherite berry',
            'drainpvp',
            'lt mace'
        ];

        let categoriesData = { overall: [] };
        let currentCategory = 'overall';

        // Funkce pro načtení dat z MongoDB přes naše API
        async function loadDataFromBot() {
            try {
                const response = await fetch('/api/players');
                if (!response.ok) {
                    throw new Error('Chyba při komunikaci se serverem');
                }
                const playersArray = await response.json();
                
                // Uloží data do sekce overall
                categoriesData.overall = playersArray;
                
                // Vykreslí tabulku s aktuálními daty z databáze
                renderTable(currentCategory, document.getElementById('searchInput').value);
            } catch (error) {
                console.error("Nepodařilo se načíst hráče z databáze:", error);
                document.getElementById('tableBody').innerHTML = '<div style="padding: 20px; text-align: center; color: #ff5252;">Nepodařilo se načíst data z databáze.</div>';
            }
        }

        function renderTable(categoryKey, filterText = '') {
            const tableBody = document.getElementById('tableBody');
            
            // Pokud jsme v záložce overall, vezmeme všechny hráče. 
            // Pokud v konkrétním kitu, vyfiltrujeme jen ty, co v něm mají tier (není "-")
            let data = categoriesData.overall || [];
            if (categoryKey !== 'overall') {
                data = data.filter(player => player.tiers && player.tiers[categoryKey] && player.tiers[categoryKey] !== '-');
            }
            
            const filteredData = data.filter(player => player.name.toLowerCase().includes(filterText.toLowerCase()));
            
            let html = '';
            
            filteredData.forEach((player, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';
                else rankClass = 'rank-4';

                let tiersHtml = '';

                if (categoryKey === 'overall') {
                    allKits.forEach(kitName => {
                        const tierVal = player.tiers ? player.tiers[kitName] : '-';
                        if (tierVal && tierVal !== '-') {
                            tiersHtml += `
                                <div class="tier-slot">
                                    <span style="font-size: 10px; color: #a0a6b5; text-transform: uppercase;">${kitName.substring(0,3)}</span>
                                    <span class="tier-badge ${tierVal}">${tierVal.toUpperCase()}</span>
                                </div>
                            `;
                        } else {
                            tiersHtml += `
                                <div class="tier-slot empty">
                                    <span style="font-size: 10px; color: #555; text-transform: uppercase;">${kitName.substring(0,3)}</span>
                                    <span class="tier-badge none" style="color: #555;">-</span>
                                </div>
                            `;
                        }
                    });
                } else {
                    const tierVal = player.tiers ? player.tiers[categoryKey] : '-';
                    tiersHtml += `
                        <div class="tier-slot">
                            <span style="font-size: 10px; color: #a0a6b5; text-transform: uppercase;">${categoryKey}</span>
                            <span class="tier-badge ${tierVal}">${tierVal.toUpperCase()}</span>
                        </div>
                    `;
                }

                html += `
                    <div class="player-row" onclick='openModal(${JSON.stringify(player)}, ${rank})'>
                        <div class="rank-skin-box ${rankClass}">
                            <span class="player-rank-num">${rank}.</span>
                            <img src="https://mc-heads.net/avatar/${player.name}/44" class="player-avatar-skin" alt="Skin">
                        </div>
                        <div class="player-details">
                            <span class="player-name">${player.name}</span>
                            <span class="player-title">${player.title}</span>
                        </div>
                        <div class="player-region ${player.regionClass}">${player.region.substring(0,2)}</div>
                        <div class="player-tiers">
                            ${tiersHtml}
                        </div>
                    </div>
                `;
            });

            tableBody.innerHTML = html || '<div style="padding: 20px; text-align: center; color: #a0a6b5;">Žádní hráči nenalezeni.</div>';
        }

        // Spustíme načtení dat hned po startu stránky
        loadDataFromBot();

        // Ovládání klikání na záložky (kity)
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                
                currentCategory = item.dataset.category;
                const searchVal = document.getElementById('searchInput').value;
                renderTable(currentCategory, searchVal);
            });
        });

        // Vyhledávání hráčů
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(currentCategory, e.target.value);
        });

        // Vyskakovací okno (modal detail hráče)
        const modal = document.getElementById('playerModal');
        const closeModalBtn = document.getElementById('closeModal');

        function openModal(player, rank) {
            document.getElementById('modalAvatar').src = `https://mc-heads.net/avatar/${player.name}/75`;
            document.getElementById('modalUsername').textContent = player.name;
            document.getElementById('modalTitleText').textContent = player.title;
            document.getElementById('modalRegionText').textContent = player.region;
            document.getElementById('modalNameMCLink').href = `https://namemc.com/search?q=${player.name}`;
            document.getElementById('modalPosNum').textContent = rank + '.';
            document.getElementById('modalPoints').textContent = player.points;
            document.getElementById('modalCategoryName').textContent = currentCategory.toUpperCase();

            let modalTiersHtml = '';
            allKits.forEach(kitName => {
                const tierVal = player.tiers && player.tiers[kitName] ? player.tiers[kitName] : '-';
                modalTiersHtml += `
                    <div class="tier-slot" style="width: 60px;">
                        <span style="font-size: 11px; color: #a0a6b5; text-align: center; margin-bottom: 2px;">${kitName}</span>
                        <span class="tier-badge ${tierVal}">${tierVal.toUpperCase()}</span>
                    </div>
                `;
            });
            document.getElementById('modalTiersBox').innerHTML = modalTiersHtml;

            modal.classList.add('active');
        }

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>

</body>
</html>
